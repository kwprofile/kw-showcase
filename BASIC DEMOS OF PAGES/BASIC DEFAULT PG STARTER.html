<!-- NAVBAR STYLING -->
<style>
    .content {
    background-color: grey;
    /* fixes the navbar issue with spacing around its background */
    margin: auto;
    }

/* --- NAVIGATION BAR STYLING --- */
    .menu {
        text-align: center;
        background-color: black;
        /* THE LINES OF CODE BELOW WILL HELP LAYER NAVBAR OVER CONTENT */
        position: relative;
        z-index: 0; /* 0 = front layer */
    }

    /* fixes the spacing between the summary btn and the first dropdown item */
    .droptop {
        margin-top: -25px;
    }

    /* gets rid of the list dots in navbar */
    .menu, .submenu {
        list-style-type: none;
    }

    /* affects the styling of buttons in the menu only */
    .menu button {
        cursor: pointer;
        color: white;
        font-size: 150%;
        padding: 10px 0;
        /* aligns drop down items to centered summary btn */
        margin-left: -40px;
        /* styling inside the buttons */
        background-color: transparent;
        border: none;
        /* setting the font */
        font-family: "Fredericka the Great", serif;
        font-weight: 400;
        font-style: normal;
    }

    /* styles the "MENU" button (summary) */
    .menu summary {
        background-color: transparent;
        list-style: none;
        border: none;
        cursor: pointer;
        color: white;
        /* matches the size of the summary btn to the dropdown buttons */
        font-size: 151%;
        font-family: Arial, Helvetica, sans-serif;
        /* adding space */
        padding-top: 15px;
        padding-bottom: 15px;
        /* setting the font */
        font-family: "Fredericka the Great", serif;
        font-weight: 400;
        font-style: normal;
    }
</style>
